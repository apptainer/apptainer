nvidia/xorg/nvidia_drv.so
nvidia/xorg/libglxserver_nvidia.so
xorg/modules/drivers/nvidia_drv.so
xorg/modules/extensions/libglxserver_nvidia.so
xorg/modules/updates/drivers/nvidia_drv.so
xorg/modules/updates/extensions/libglxserver_nvidia.so

