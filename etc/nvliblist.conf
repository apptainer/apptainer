# NVLIBLIST.CONF
# This configuration file determines which NVIDIA libraries to search for on 
# the host system when the --nv option is invoked.  You can edit it if you have
# different libraries on your host system.  You can also add binaries and they
# will be mounted into the container when the --nv option is passed.
#
# An entry is one of: a binary, found on PATH; a library, a bare name ending in
# .so that is found in the ld.so cache and in the 'gpu library path' directories
# of apptainer.conf; a module that a program opens by path, given as its path
# relative to a library directory and also ending in .so; or a non-library file,
# given as an absolute path.  Each kind is described in its section below.
# With --nvccli, nvidia-container-cli stages the driver's own libraries, and the
# entries of this list that it does not stage are bound the same way as with
# --nv.

# put binaries here
# In shared environments you should ensure that permissions on these files 
# exclude writing by non-privileged users.  
nvidia-smi
nvidia-debugdump
nvidia-persistenced
nvidia-cuda-mps-control
nvidia-cuda-mps-server
nvidia-xconfig

