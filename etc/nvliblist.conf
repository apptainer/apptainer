# put the modules that a program opens by path rather than by name here, as
# their path relative to a library directory (must end in .so): the GBM backend
# and the X server driver and GLX modules, which the ld.so cache never lists.
# Each is looked for under that path next to every library directory, and next
# to the directory's parent (Debian keeps /usr/lib/xorg/modules beside
# /usr/lib/<multiarch>), and is bound both at its host path and at the same
# relative path under /.singularity.d/libs.
